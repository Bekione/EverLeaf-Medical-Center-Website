<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#136dec" />
    <title>Everleaf Medical Center</title>
    <meta
      name="description"
      content="Care That Grows With You. Committed to lifelong wellness through compassionate care."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://everleaf.com/" />
    <meta
      property="og:title"
      content="EverLeaf Medical Center - Care That Grows With You"
    />
    <meta
      property="og:description"
      content="Professional healthcare services with compassionate care, specialized departments, and expert doctors."
    />
    <meta property="og:image" content="https://everleaf.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://everleaf.com/" />
    <meta
      property="twitter:title"
      content="EverLeaf Medical Center - Care That Grows With You"
    />
    <meta
      property="twitter:description"
      content="Professional healthcare services with compassionate care, specialized departments, and expert doctors."
    />
    <meta
      property="twitter:image"
      content="https://everleaf.com/og-image.jpg"
    />

    <!-- Performance: Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.tailwindcss.com" />

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Performance: Async Material Icons to prevent render blocking -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined"
        rel="stylesheet"
      />
    </noscript>

    <!-- Performance: font-display swap already included -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700;900&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#136dec", // Darker Blue
                dark: "#0e5bc4",
                light: "#e0f2fe",
              },
              secondary: "#10b981", // Green for leaf
              dark: "#101822",
              light: "#f6f7f8",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Merriweather", "serif"],
              brand: ["Montserrat", "sans-serif"],
              brandalt: ["Poppins", "sans-serif"],
            },
            animation: {
              "fade-in": "fadeIn 0.5s ease-out",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0", transform: "translateY(10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      /* Custom scrollbar for gallery thumbnails */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
