<!doctype html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#136dec" />
    <title>Everleaf Medical Center</title>
    <meta
      name="description"
      content="Care That Grows With You. Committed to lifelong wellness through compassionate care."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://everleaf-medical-center.vercel.app/"
    />
    <meta
      property="og:title"
      content="EverLeaf Medical Center - Care That Grows With You"
    />
    <meta
      property="og:description"
      content="Professional healthcare services with compassionate care, specialized departments, and expert doctors."
    />
    <meta
      property="og:image"
      content="https://everleaf-medical-center.vercel.app/og-image.jpg"
    />
    <meta property="og:site_name" content="EverLeaf Medical Center" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://everleaf-medical-center.vercel.app/"
    />
    <meta
      property="twitter:title"
      content="EverLeaf Medical Center - Care That Grows With You"
    />
    <meta
      property="twitter:description"
      content="Professional healthcare services with compassionate care, specialized departments, and expert doctors."
    />
    <meta
      property="twitter:image"
      content="https://everleaf-medical-center.vercel.app/og-image.jpg"
    />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload Material Icons fonts to minimize blank duration -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/materialicons/v140/flUhRq6tzZclQEJ-Vdg-IuiaDsNc.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/materialiconsoutlined/v109/gok-H7zzDkdnRel8-DQ6KAXJ69wP1tGnf4ZGhUce.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Material Icons (async) -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined&display=block"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined&display=block"
        rel="stylesheet"
    /></noscript>

    <!-- Fonts (async — not render-blocking) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700;900&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&family=Lato:wght@300;400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700;900&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet"
    /></noscript>

    <!-- Apply saved theme BEFORE first paint to prevent flash of wrong theme -->
    <script>
      (function () {
        var saved = localStorage.getItem("everleaf-theme") || "default";
        document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

    <!-- Sienna Accessibility Widget — lazy loaded after page is interactive -->
    <!-- Both the widget and the patch are injected after window.load + 2s   -->
    <!-- to keep them off the critical path and preserve Lighthouse scores.  -->
    <script>
      window.addEventListener("load", function () {
        setTimeout(function () {
          // 1. Load Sienna CDN script
          var sienna = document.createElement("script");
          sienna.src =
            "https://cdn.jsdelivr.net/npm/sienna-accessibility@2.0.1/dist/sienna-accessibility.umd.js";
          sienna.async = true;

          // 2. Once Sienna is ready, load the theme-patch script
          sienna.onload = function () {
            var patch = document.createElement("script");
            patch.src = "/sienna-patch.js";
            patch.async = true;
            document.body.appendChild(patch);
          };

          document.body.appendChild(sienna);
        }, 2000); // 2-second idle delay after page load
      });
    </script>
  </body>
</html>
