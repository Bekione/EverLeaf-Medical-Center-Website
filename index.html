    <style>
      /* ═══════════════════════════════════════════════════════════════════════
         THEME TOKENS
         Each [data-theme] block defines all design tokens.
         Switching themes = setting data-theme on <html>.
         ═══════════════════════════════════════════════════════════════════════ */

      /* ── Default — Clean Clinical Blue ─────────────────────────────────── */
      [data-theme="default"] {
        --color-primary: #136dec;
        --color-primary-dark: #0e5bc4;
        --color-primary-light: #e0f2fe;
        --color-secondary: #10b981;
        --color-bg: #ffffff;
        --color-bg-alt: #f6f7f8;
        --color-surface: #ffffff;
        --color-surface-rgb: 255, 255, 255;
        --color-border: #e2e8f0;
        --color-text: #0f172a;
        --color-text-muted: #64748b;
        --color-dark: #101822;
        --color-footer-bg: #0d1520;
        --color-cta-from: #0f172a;
        --color-cta-to: #1e3a8a;
        --color-cta-accent: #93c5fd;
        --font-sans: "Inter", sans-serif;
        --font-serif: "Merriweather", serif;
        --font-brand: "Montserrat", sans-serif;
        --radius-card: 1rem;
        --shadow-card: 0 4px 24px 0 rgba(19, 109, 236, 0.07);
      }

      /* ── Dark — Deep Navy Medical ───────────────────────────────────────── */
      [data-theme="dark"] {
        --color-primary: #60a5fa;
        --color-primary-dark: #3b82f6;
        --color-primary-light: #1e3a5f;
        --color-secondary: #34d399;
        --color-bg: #0f172a;
        --color-bg-alt: #1e293b;
        --color-surface: #1e293b;
        --color-surface-rgb: 30, 41, 59;
        --color-border: #334155;
        --color-text: #f1f5f9;
        --color-text-muted: #94a3b8;
        --color-dark: #f1f5f9;
        --color-footer-bg: #020617;
        --color-cta-from: #020617;
        --color-cta-to: #0f172a;
        --color-cta-accent: #60a5fa;
        --font-sans: "Inter", sans-serif;
        --font-serif: "Merriweather", serif;
        --font-brand: "Montserrat", sans-serif;
        --radius-card: 1rem;
        --shadow-card: 0 4px 24px 0 rgba(0, 0, 0, 0.4);
      }

      /* ── Forest — Calm Green / Natural Healing ──────────────────────────── */
      [data-theme="forest"] {
        --color-primary: #059669;
        --color-primary-dark: #047857;
        --color-primary-light: #d1fae5;
        --color-secondary: #0891b2;
        --color-bg: #f0fdf4;
        --color-bg-alt: #ecfdf5;
        --color-surface: #ffffff;
        --color-surface-rgb: 255, 255, 255;
        --color-border: #bbf7d0;
        --color-text: #064e3b;
        --color-text-muted: #6b7280;
        --color-dark: #064e3b;
        --color-footer-bg: #022c22;
        --color-cta-from: #064e3b;
        --color-cta-to: #065f46;
        --color-cta-accent: #6ee7b7;
        --font-sans: "Lato", sans-serif;
        --font-serif: "Merriweather", serif;
        --font-brand: "Montserrat", sans-serif;
        --radius-card: 1.25rem;
        --shadow-card: 0 4px 24px 0 rgba(5, 150, 105, 0.1);
      }

      /* ── Warm — Welcoming Amber / Private Clinic ────────────────────────── */
      [data-theme="warm"] {
        --color-primary: #d97706;
        --color-primary-dark: #b45309;
        --color-primary-light: #fef3c7;
        --color-secondary: #dc2626;
        --color-bg: #fffbeb;
        --color-bg-alt: #fef9ee;
        --color-surface: #ffffff;
        --color-surface-rgb: 255, 255, 255;
        --color-border: #fde68a;
        --color-text: #1c1917;
        --color-text-muted: #78716c;
        --color-dark: #1c1917;
        --color-footer-bg: #1c0a00;
        --color-cta-from: #78350f;
        --color-cta-to: #92400e;
        --color-cta-accent: #fcd34d;
        --font-sans: "Poppins", sans-serif;
        --font-serif: "Merriweather", serif;
        --font-brand: "Poppins", sans-serif;
        --radius-card: 1.5rem;
        --shadow-card: 0 4px 24px 0 rgba(217, 119, 6, 0.1);
      }

      /* ── High Contrast — WCAG AAA ───────────────────────────────────────── */
      [data-theme="high-contrast"] {
        --color-primary: #0000cc;
        --color-primary-dark: #000099;
        --color-primary-light: #e8e8ff;
        --color-secondary: #006600;
        --color-bg: #ffffff;
        --color-bg-alt: #f5f5f5;
        --color-surface: #ffffff;
        --color-border: #000000;
        --color-text: #000000;
        --color-text-muted: #333333;
        --color-dark: #000000;
        --color-footer-bg: #000000;
        --color-cta-from: #000033;
        --color-cta-to: #000066;
        --color-cta-accent: #ffff00;
        --font-sans: "Inter", sans-serif;
        --font-serif: "Merriweather", serif;
        --font-brand: "Montserrat", sans-serif;
        --radius-card: 0.5rem;
        --shadow-card: 0 0 0 2px #000000;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         GLOBAL BASE
         ═══════════════════════════════════════════════════════════════════════ */
      html,
      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
      }

      /* Smooth theme transitions — color properties only, not layout */
      *,
      *::before,
      *::after {
        transition-property:
          background-color, border-color, color, box-shadow, fill, stroke;
        transition-duration: 0.25s;
        transition-timing-function: ease;
      }

      /* Scrollbar hide utility */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

        background-color: var(--color-bg-alt) !important;

      /* ═══════════════════════════════════════════════════════════════════════
         CTA SECTION THEMING — gradient overrides per theme
         ═══════════════════════════════════════════════════════════════════════ */
      [data-theme="forest"] .from-slate-900 {
        --tw-gradient-from: var(--color-cta-from) !important;
      }
      [data-theme="forest"] .to-blue-900 {
        --tw-gradient-to: var(--color-cta-to) !important;
      }
      [data-theme="warm"] .from-slate-900 {
        --tw-gradient-from: var(--color-cta-from) !important;
      }
      [data-theme="warm"] .to-blue-900 {
        --tw-gradient-to: var(--color-cta-to) !important;
      }
      [data-theme="high-contrast"] .from-slate-900 {
        --tw-gradient-from: var(--color-cta-from) !important;
      }
      [data-theme="high-contrast"] .to-blue-900 {
        --tw-gradient-to: var(--color-cta-to) !important;
      }
      [data-theme="dark"] .from-slate-900 {
        --tw-gradient-from: var(--color-cta-from) !important;
      }
      [data-theme="dark"] .to-blue-900 {
        --tw-gradient-to: var(--color-cta-to) !important;
      }

      /* About page hero gradient */
      [data-theme="dark"] .from-blue-50 {
        --tw-gradient-from: #0f172a !important;
      }
      [data-theme="forest"] .from-blue-50 {
        --tw-gradient-from: #f0fdf4 !important;
      }
      [data-theme="warm"] .from-blue-50 {
        --tw-gradient-from: #fffbeb !important;
      }

      /* CTA accent text */
      [data-theme="forest"] .text-blue-300,
      [data-theme="warm"] .text-blue-300,
      [data-theme="high-contrast"] .text-blue-300,
      [data-theme="dark"] .text-blue-300 {
        color: var(--color-cta-accent) !important;
      }

      /* CTA body text */
      [data-theme="forest"] .text-blue-100,
      [data-theme="warm"] .text-blue-100,
      [data-theme="dark"] .text-blue-100 {
        color: rgba(255, 255, 255, 0.8) !important;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         SUB-PAGE SPECIFIC OVERRIDES (services/*, departments/*)
         ═══════════════════════════════════════════════════════════════════════ */

      /* Department header decorative skew bg */
      [data-theme="dark"] .bg-blue-50\/50,
      [data-theme="forest"] .bg-blue-50\/50,
      [data-theme="warm"] .bg-blue-50\/50,
      [data-theme="high-contrast"] .bg-blue-50\/50 {
        background-color: color-mix(
          in srgb,
          var(--color-primary) 8%,
          transparent
        ) !important;
      }

      /* Pricing card header sections (bg-slate-50 inside cards) */
      [data-theme="dark"] .bg-primary\/5,
      [data-theme="forest"] .bg-primary\/5,
      [data-theme="warm"] .bg-primary\/5,
      [data-theme="high-contrast"] .bg-primary\/5 {
        background-color: color-mix(
          in srgb,
          var(--color-primary) 8%,
          var(--color-surface)
        ) !important;
      }

      /* Table backgrounds in comparison sections */
      [data-theme="dark"] table,
      [data-theme="forest"] table,
      [data-theme="warm"] table,
      [data-theme="high-contrast"] table {
        background-color: var(--color-surface) !important;
        color: var(--color-text) !important;
      }
      [data-theme="dark"] thead tr,
      [data-theme="forest"] thead tr,
      [data-theme="warm"] thead tr,
      [data-theme="high-contrast"] thead tr {
        background-color: var(--color-bg-alt) !important;
      }
      [data-theme="dark"] .divide-y > tr,
      [data-theme="forest"] .divide-y > tr,
      [data-theme="warm"] .divide-y > tr,
      [data-theme="high-contrast"] .divide-y > tr {
        border-color: var(--color-border) !important;
      }
      [data-theme="dark"] .text-slate-700,
      [data-theme="forest"] .text-slate-700,
      [data-theme="warm"] .text-slate-700,
      [data-theme="high-contrast"] .text-slate-700 {
        color: var(--color-text) !important;
      }

      /* Sub-page CTA gradient overrides — from-slate-900 to-blue-900 */
      [data-theme="dark"] .from-slate-900.to-blue-900,
      [data-theme="forest"] .from-slate-900.to-blue-900,
      [data-theme="warm"] .from-slate-900.to-blue-900,
      [data-theme="high-contrast"] .from-slate-900.to-blue-900,
      [data-theme="dark"] .bg-gradient-to-br.from-slate-900,
      [data-theme="forest"] .bg-gradient-to-br.from-slate-900,
      [data-theme="warm"] .bg-gradient-to-br.from-slate-900,
      [data-theme="high-contrast"] .bg-gradient-to-br.from-slate-900 {
        background: linear-gradient(
          135deg,
          var(--color-cta-from),
          var(--color-cta-to)
        ) !important;
      }

      /* Sub-page CTA gradient — from-emerald-900 to-slate-900 */
      [data-theme="dark"] .from-emerald-900,
      [data-theme="forest"] .from-emerald-900,
      [data-theme="warm"] .from-emerald-900,
      [data-theme="high-contrast"] .from-emerald-900 {
        background: linear-gradient(
          135deg,
          var(--color-cta-from),
          var(--color-cta-to)
        ) !important;
      }

      /* CTA text accent for sub-pages (emerald-300) */
      [data-theme="dark"] .text-emerald-300,
      [data-theme="forest"] .text-emerald-300,
      [data-theme="warm"] .text-emerald-300,
      [data-theme="high-contrast"] .text-emerald-300 {
        color: var(--color-cta-accent) !important;
      }

      /* CTA body text for sub-pages (emerald-100) */
      [data-theme="dark"] .text-emerald-100,
      [data-theme="forest"] .text-emerald-100,
      [data-theme="warm"] .text-emerald-100,
      [data-theme="high-contrast"] .text-emerald-100 {
        color: rgba(255, 255, 255, 0.85) !important;
      }

      /* bg-blue-100 icon backgrounds in sub-pages */
      [data-theme="dark"] .bg-blue-100,
      [data-theme="forest"] .bg-blue-100,
      [data-theme="warm"] .bg-blue-100,
      [data-theme="high-contrast"] .bg-blue-100 {
        background-color: var(--color-primary-light) !important;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         DEPARTMENT PAGE OVERRIDES — covers all [data-theme] except default
         Patterns: bg-white headers, border-slate-100 cards, bg-white sections
         ═══════════════════════════════════════════════════════════════════════ */

      /* Department page light-background headers (bg-white border-b border-slate-100) */
      [data-theme="dark"] header.bg-white,
      [data-theme="dark"] header.relative.bg-white,
      [data-theme="forest"] header.bg-white,
      [data-theme="forest"] header.relative.bg-white,
      [data-theme="warm"] header.bg-white,
      [data-theme="warm"] header.relative.bg-white,
      [data-theme="high-contrast"] header.bg-white,
      [data-theme="high-contrast"] header.relative.bg-white {
        background-color: var(--color-surface) !important;
        border-color: var(--color-border) !important;
      }

      /* border-slate-100 — used heavily on department cards, dividers, and section borders */
      [data-theme="dark"] .border-slate-100,
      [data-theme="forest"] .border-slate-100,
      [data-theme="warm"] .border-slate-100,
      [data-theme="high-contrast"] .border-slate-100 {
        border-color: var(--color-border) !important;
      }

      /* bg-white sections used as alternating section backgrounds in department pages */
      [data-theme="dark"] section.bg-white,
      [data-theme="dark"] section.py-20.bg-white,
      [data-theme="dark"] section.py-16.bg-white,
      [data-theme="forest"] section.bg-white,
      [data-theme="forest"] section.py-20.bg-white,
      [data-theme="forest"] section.py-16.bg-white,
      [data-theme="warm"] section.bg-white,
      [data-theme="warm"] section.py-20.bg-white,
      [data-theme="warm"] section.py-16.bg-white,
      [data-theme="high-contrast"] section.bg-white,
      [data-theme="high-contrast"] section.py-20.bg-white,
      [data-theme="high-contrast"] section.py-16.bg-white {
        background-color: var(--color-surface) !important;
        border-color: var(--color-border) !important;
      }

      /* bg-slate-50 sections used in department pages (alternating with bg-white) */
      [data-theme="dark"] section.bg-slate-50,
      [data-theme="dark"] section.py-20.bg-slate-50,
      [data-theme="dark"] section.py-16.bg-slate-50,
      [data-theme="forest"] section.bg-slate-50,
      [data-theme="forest"] section.py-20.bg-slate-50,
      [data-theme="forest"] section.py-16.bg-slate-50,
      [data-theme="warm"] section.bg-slate-50,
      [data-theme="warm"] section.py-20.bg-slate-50,
      [data-theme="warm"] section.py-16.bg-slate-50,
      [data-theme="high-contrast"] section.bg-slate-50,
      [data-theme="high-contrast"] section.py-20.bg-slate-50,
      [data-theme="high-contrast"] section.py-16.bg-slate-50 {
        background-color: var(--color-bg-alt) !important;
      }

      /* Floating stat cards (absolute positioned, bg-white border-slate-100) */
      [data-theme="dark"] .absolute.bg-white,
      [data-theme="forest"] .absolute.bg-white,
      [data-theme="warm"] .absolute.bg-white,
      [data-theme="high-contrast"] .absolute.bg-white {
        background-color: var(--color-surface) !important;
        border-color: var(--color-border) !important;
      }

      /* bg-slate-50 rounded-3xl info panels in department pages */
      [data-theme="dark"] .bg-slate-50.rounded-3xl,
      [data-theme="forest"] .bg-slate-50.rounded-3xl,
      [data-theme="warm"] .bg-slate-50.rounded-3xl,
      [data-theme="high-contrast"] .bg-slate-50.rounded-3xl {
        background-color: var(--color-bg-alt) !important;
        border-color: var(--color-border) !important;
      }

      /* hover:bg-slate-50 list items in department service lists */
      [data-theme="dark"] .hover\:bg-slate-50:hover,
      [data-theme="forest"] .hover\:bg-slate-50:hover,
      [data-theme="warm"] .hover\:bg-slate-50:hover,
      [data-theme="high-contrast"] .hover\:bg-slate-50:hover {
        background-color: var(--color-bg-alt) !important;
      }

      /* hover:border-slate-100 transparent borders on hover */
      [data-theme="dark"] .hover\:border-slate-100:hover,
      [data-theme="forest"] .hover\:border-slate-100:hover,
      [data-theme="warm"] .hover\:border-slate-100:hover,
      [data-theme="high-contrast"] .hover\:border-slate-100:hover {
        border-color: var(--color-border) !important;
      }

      /* border-y border-slate-100 — horizontal rule sections */
      [data-theme="dark"] .border-y,
      [data-theme="forest"] .border-y,
      [data-theme="warm"] .border-y,
      [data-theme="high-contrast"] .border-y {
        border-color: var(--color-border) !important;
      }

      /* border-t border-slate-100 — top dividers inside cards */
      [data-theme="dark"] .border-t.border-slate-100,
      [data-theme="forest"] .border-t.border-slate-100,
      [data-theme="warm"] .border-t.border-slate-100,
      [data-theme="high-contrast"] .border-t.border-slate-100 {
        border-color: var(--color-border) !important;
      }

      /* text-slate-700 in department pages (headings, sub-labels) */
      [data-theme="dark"] .text-slate-700,
      [data-theme="forest"] .text-slate-700,
      [data-theme="warm"] .text-slate-700,
      [data-theme="high-contrast"] .text-slate-700 {
        color: var(--color-text) !important;
      }

      /* text-slate-800 in department pages */
      [data-theme="dark"] .text-slate-800,
      [data-theme="forest"] .text-slate-800,
      [data-theme="warm"] .text-slate-800,
      [data-theme="high-contrast"] .text-slate-800 {
        color: var(--color-text) !important;
      }

      /* bg-primary\/5 section accent backgrounds (Ophthalmology) */
      [data-theme="dark"] .bg-primary\/5,
      [data-theme="forest"] .bg-primary\/5,
      [data-theme="warm"] .bg-primary\/5,
      [data-theme="high-contrast"] .bg-primary\/5 {
        background-color: color-mix(
          in srgb,
          var(--color-primary) 8%,
          var(--color-surface)
        ) !important;
        border-color: var(--color-border) !important;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         HIGH CONTRAST OVERRIDES
         ═══════════════════════════════════════════════════════════════════════ */
      [data-theme="high-contrast"] a:focus,
      [data-theme="high-contrast"] button:focus {
        outline: 3px solid #0000cc;
        outline-offset: 2px;
      }
      [data-theme="high-contrast"] .shadow-sm,
      [data-theme="high-contrast"] .shadow-md,
      [data-theme="high-contrast"] .shadow-lg,
      [data-theme="high-contrast"] .shadow-xl,
      [data-theme="high-contrast"] .shadow-2xl {
        box-shadow: 0 0 0 1px #000 !important;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         FORM INPUT OVERRIDES — Contact page inputs adapt to theme
         ═══════════════════════════════════════════════════════════════════════ */
      [data-theme="dark"]
        input:not([type="submit"]):not([type="button"]):not([type="reset"]):not(
          [type="checkbox"]
        ):not([type="radio"]):not([type="range"]):not([type="file"]),
      [data-theme="dark"] textarea,
      [data-theme="dark"] select {
        background-color: var(--color-bg-alt) !important;
        color: var(--color-text) !important;
        border-color: var(--color-border) !important;
      }
      [data-theme="dark"] input::placeholder,
      [data-theme="dark"] textarea::placeholder {
        color: var(--color-text-muted) !important;
        opacity: 0.6;
      }
      [data-theme="forest"]
        input:not([type="submit"]):not([type="button"]):not([type="reset"]):not(
          [type="checkbox"]
        ):not([type="radio"]):not([type="range"]):not([type="file"]),
      [data-theme="forest"] textarea,
      [data-theme="forest"] select {
        background-color: var(--color-bg-alt) !important;
        color: var(--color-text) !important;
        border-color: var(--color-border) !important;
      }
      [data-theme="forest"] input::placeholder,
      [data-theme="forest"] textarea::placeholder {
        color: var(--color-text-muted) !important;
        opacity: 0.7;
      }
      [data-theme="warm"]
        input:not([type="submit"]):not([type="button"]):not([type="reset"]):not(
          [type="checkbox"]
        ):not([type="radio"]):not([type="range"]):not([type="file"]),
      [data-theme="warm"] textarea,
      [data-theme="warm"] select {
        background-color: var(--color-bg-alt) !important;
        color: var(--color-text) !important;
        border-color: var(--color-border) !important;
      }
      [data-theme="high-contrast"]
        input:not([type="submit"]):not([type="button"]):not([type="reset"]):not(
          [type="checkbox"]
        ):not([type="radio"]):not([type="range"]):not([type="file"]),
      [data-theme="high-contrast"] textarea,
      [data-theme="high-contrast"] select {
        background-color: #ffffff !important;
        color: #000000 !important;
        border-color: #000000 !important;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         ICON BOX OVERRIDES — Small icon boxes use bg-alt for contrast vs surface
         (Radiology/Surgery services cards: w-16 h-16 bg-white / p-3 bg-white)
         ═══════════════════════════════════════════════════════════════════════ */
      [data-theme="dark"] .w-16.h-16.bg-white,
      [data-theme="dark"] .w-12.h-12.bg-white,
      [data-theme="dark"] .mb-4.inline-block.p-3.bg-white,
      [data-theme="dark"] .mb-4.inline-block.bg-white {
        background-color: var(--color-bg-alt) !important;
        box-shadow: 0 1px 4px 0 rgba(0, 0, 0, 0.3) !important;
      }
      [data-theme="forest"] .w-16.h-16.bg-white,
      [data-theme="forest"] .w-12.h-12.bg-white,
      [data-theme="forest"] .mb-4.inline-block.p-3.bg-white,
      [data-theme="forest"] .mb-4.inline-block.bg-white {
        background-color: var(--color-bg-alt) !important;
        box-shadow: 0 1px 4px 0 rgba(0, 0, 0, 0.1) !important;
      }
      [data-theme="warm"] .w-16.h-16.bg-white,
      [data-theme="warm"] .w-12.h-12.bg-white,
      [data-theme="warm"] .mb-4.inline-block.p-3.bg-white,
      [data-theme="warm"] .mb-4.inline-block.bg-white {
        background-color: var(--color-bg-alt) !important;
        box-shadow: 0 1px 4px 0 rgba(0, 0, 0, 0.1) !important;
      }
      [data-theme="high-contrast"] .w-16.h-16.bg-white,
      [data-theme="high-contrast"] .w-12.h-12.bg-white,
      [data-theme="high-contrast"] .mb-4.inline-block.p-3.bg-white,
      [data-theme="high-contrast"] .mb-4.inline-block.bg-white {
        background-color: #ffffff !important;
        border: 2px solid #000000 !important;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         CTA SECTION OVERRIDES — Department page dark gradient CTA sections
         (from-slate-800 to-slate-900, bg-slate-900, bg-gradient-to-br)
         ═══════════════════════════════════════════════════════════════════════ */
      [data-theme="forest"] .bg-gradient-to-br.from-slate-800,
      [data-theme="forest"] .bg-gradient-to-br.from-blue-950 {
        --tw-gradient-from: #064e3b !important;
        --tw-gradient-stops:
          var(--tw-gradient-from), var(--tw-gradient-to) !important;
      }
      [data-theme="forest"] .to-slate-900,
      [data-theme="forest"] .bg-gradient-to-br.to-slate-900 {
        --tw-gradient-to: #022c22 !important;
      }
      [data-theme="forest"] section.bg-slate-900,
      [data-theme="forest"] .py-20.bg-slate-900 {
        background-color: #022c22 !important;
      }
      [data-theme="warm"] .bg-gradient-to-br.from-slate-800,
      [data-theme="warm"] .bg-gradient-to-br.from-blue-950 {
        --tw-gradient-from: #78350f !important;
        --tw-gradient-stops:
          var(--tw-gradient-from), var(--tw-gradient-to) !important;
      }
      [data-theme="warm"] .to-slate-900,
      [data-theme="warm"] .bg-gradient-to-br.to-slate-900 {
        --tw-gradient-to: #451a03 !important;
      }
      [data-theme="warm"] section.bg-slate-900,
      [data-theme="warm"] .py-20.bg-slate-900 {
        background-color: #451a03 !important;
      }
    </style>

    <!-- Apply saved theme BEFORE first paint to prevent flash of wrong theme -->
    <script>
      (function () {
        var saved = localStorage.getItem("everleaf-theme") || "default";
        document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "var(--color-primary)",
                dark: "var(--color-primary-dark)",
                light: "var(--color-primary-light)",
              },
              secondary: "var(--color-secondary)",
              dark: "var(--color-dark)",
              light: "var(--color-bg-alt)",
            },
            fontFamily: {
              sans: ["var(--font-sans)"],
              serif: ["var(--font-serif)"],
              brand: ["var(--font-brand)"],
              brandalt: ["Poppins", "sans-serif"],
            },
            boxShadow: {
              card: "var(--shadow-card)",
            },
            animation: {
              "fade-in": "fadeIn 0.5s ease-out",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0", transform: "translateY(10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
